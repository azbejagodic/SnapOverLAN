name: Release

on:
  push:
    tags:
      - 'v[0-9]*.[0-9]*.[0-9]*'

permissions:
  contents: write

jobs:
  windows-release:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22.12.0'
          cache: npm

      - name: Verify tag matches desktop version
        shell: pwsh
        run: |
          $packageVersion = node -p "require('./package.json').version"
          if ("v$packageVersion" -ne "${{ github.ref_name }}") {
            throw "Tag ${{ github.ref_name }} does not match package.json version $packageVersion."
          }

      - name: Install dependencies
        run: npm ci

      - name: Run automated tests
        run: node --test

      - name: Build unsigned release artifacts
        run: npm run release:build
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Verify release artifacts
        shell: pwsh
        run: |
          $packageVersion = node -p "require('./package.json').version"
          $extensionVersion = node -p "require('./extension/manifest.json').version"
          $expected = @(
            "dist/SnapOverLAN Setup $packageVersion-x64.exe",
            "dist/SnapOverLAN-$packageVersion-portable-x64.exe",
            "dist/SnapOverLAN-extension-$extensionVersion.zip"
          )
          foreach ($artifact in $expected) {
            if (-not (Test-Path -LiteralPath $artifact -PathType Leaf)) {
              throw "Expected release artifact was not generated: $artifact"
            }
          }

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/SnapOverLAN Setup *-x64.exe
            dist/SnapOverLAN-*-portable-x64.exe
            dist/SnapOverLAN-extension-*.zip
