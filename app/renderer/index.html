<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SnapOverLAN</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <main class="app-shell" aria-label="SnapOverLAN">
    <div class="titlebar-drag-region" aria-hidden="true">
      <span class="titlebar-brand">
        <img class="titlebar-brand-icon" src="../../assets/branding/snapoverlan-mark.svg" alt="" />
        <span>SnapOverLAN</span>
      </span>
    </div>
    <header class="title-row">
      <div class="server-controls">
        <p id="connectionPill" class="server-line checking" aria-live="polite">
          <span class="status-dot" aria-hidden="true"></span>
          <span>Checking server</span>
        </p>
        <button id="backgroundToggleBtn" class="header-toggle" type="button" aria-label="Turn background mode on" aria-pressed="false">Background: Off</button>
        <button id="retryServerBtn" class="header-toggle" type="button" hidden>Retry server</button>
      </div>
      <div class="header-actions">
        <button id="qrBtn" class="header-button qr-button" type="button">QR</button>
        <button id="refreshBtn" class="header-button refresh-button" type="button">Refresh</button>
      </div>
    </header>

    <section class="main-grid" aria-label="Recent batches">
      <article class="panel batches-workspace" aria-labelledby="batchesTitle">
        <div class="batches-header">
          <h2 id="batchesTitle">Recent uploads</h2>
          <div class="batch-toolbar-actions">
            <button id="downloadCurrentBatchBtn" class="batch-button" type="button" disabled>Download</button>
            <button id="clearBatchesBtn" class="batch-button danger" type="button">Clear all</button>
          </div>
        </div>
        <p id="batchMessage" class="batch-message" hidden></p>
        <div id="batchesList" class="batches-list" tabindex="0" aria-label="Recent batches list"></div>
      </article>
    </section>

    <div id="qrModal" class="modal-backdrop" hidden>
      <section class="qr-modal" role="dialog" aria-modal="true" aria-labelledby="qrTitle">
        <h2 id="qrTitle">QR</h2>
        <div class="qr-frame">
          <canvas id="phoneQr" aria-label="QR code for phone upload URL"></canvas>
          <p id="qrFallback" class="status-text"></p>
        </div>
        <p id="phoneUrl" class="phone-url" aria-label="LAN phone upload URL"></p>
        <button id="closeQrBtn" class="modal-close-button" type="button">Close</button>
      </section>
    </div>

    <details id="diagnosticsPanel" class="diagnostics-section" hidden>
      <summary>
        <span id="diagnosticsTitle">Server diagnostics</span>
        <span id="diagnosticsSummary" aria-live="polite">Checking</span>
      </summary>
      <dl id="diagnosticsList"></dl>
      <div id="diagnosticsWarning" hidden></div>
      <div id="diagnosticsUrls" hidden></div>
    </details>
  </main>

  <p id="autoCopyMessage" class="auto-copy-message" role="status" aria-live="polite" hidden></p>

  <script type="module" src="./app.js"></script>
</body>
</html>
