<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="SnapOverLAN" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#343940" />
  <link rel="manifest" href="/manifest.json" />
  <link rel="icon" href="/icons/favicon.ico" sizes="any" />
  <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="/icons/favicon-16.png" />
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
  <link rel="stylesheet" href="/styles.css" />
  <title>SnapOverLAN</title>
</head>
<body>
  <main class="app">
    <section class="card upload-card">
      <h1 class="brand-lockup"><img class="brand-logo" src="/icons/mark-128.png" alt="" /><span class="brand">SnapOver<span class="brand-lan">LAN</span></span></h1>

      <div class="actions">
        <label class="input-btn" for="cameraInput">Take photo</label>
        <!--
          Camera input:
          - accept limits the picker to supported photo formats.
          - capture="environment" hints rear camera on supported phones.
          - We intentionally omit `multiple` so this path is one photo per capture.
        -->
        <input id="cameraInput" type="file" accept="image/jpeg,image/png,image/webp,image/heic,image/heif" capture="environment" hidden />

        <label class="input-btn" for="galleryInput">Choose from gallery</label>
        <!--
          Gallery input:
          - accept filters to supported photo formats.
          - multiple allows selecting many photos in one picker action.
        -->
        <input id="galleryInput" type="file" accept="image/jpeg,image/png,image/webp,image/heic,image/heif" multiple hidden />

        <button id="uploadBtn" class="btn" type="button" disabled>Upload selected photos</button>
      </div>

      <p id="status" class="pwa-status" aria-live="polite"></p>
    </section>

    <section class="card tray-card">
      <div class="tray-head">
        <h2>Selected photos</h2>
        <span id="selectedCount" class="count">Selected: 0 / 20</span>
      </div>
      <div id="selectedGrid" class="grid"></div>
    </section>

  </main>

  <script src="/app.js"></script>
</body>
</html>
